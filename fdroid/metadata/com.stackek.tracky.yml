Categories:
  - Money
License: GPL-3.0-or-later
AuthorName: stackek
AuthorEmail: github@tkqs.de
WebSite: https://github.com/stackek/tracky
SourceCode: https://github.com/stackek/tracky
IssueTracker: https://github.com/stackek/tracky/issues
Changelog: https://github.com/stackek/tracky/blob/main/CHANGELOG.md

RepoType: git
Repo: https://github.com/stackek/tracky.git

Builds:
  - versionName: 1.0.1
    versionCode: 2
    commit: v1.0.1
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.4
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - .pub-cache
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: '1.0.1'
CurrentVersionCode: 2
